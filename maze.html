.cell{width:20px;height:20px;box-sizing:border-box;position:relative;background:#fff;}

.cell.exit::after{content:attr(data-label);position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-weight:bold;color:#1565c0;}
.cell.solution{background:#fff59d;}
.legend{margin-top:20px;}
.legend span{display:inline-block;margin-right:15px;}
